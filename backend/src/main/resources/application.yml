server:
  port: 8088
  servlet:
    context-path: /

spring:
  application:
    name: arena3-backend
  datasource:
    url: jdbc:h2:mem:arena3;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.arena3: INFO
    org.springframework.security: WARN
